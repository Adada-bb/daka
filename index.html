<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学习打卡">
<title>学习打卡</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
         background: #fef6e4; color: #333; padding-bottom: 40px; }
  .header { background: #f9c74f; padding: 24px 20px 16px; text-align: center;
            border-radius: 0 0 28px 28px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .header h1 { margin: 0; font-size: 26px; }
  .header .date { font-size: 16px; margin-top: 6px; opacity: .8; }
  .header .type { display: inline-block; margin-top: 8px; padding: 4px 14px; background: #fff;
                  border-radius: 20px; font-size: 15px; }
  .progress { margin: 18px 20px 6px; height: 18px; background: #fff; border-radius: 10px; overflow: hidden;
              border: 2px solid #f9c74f; }
  .progress > div { height: 100%; background: #90be6d; width: 0; transition: width .4s; }
  .stars { text-align: center; font-size: 18px; margin-bottom: 10px; }
  .list { padding: 0 16px; }
  .task { display: flex; align-items: center; background: #fff; border-radius: 20px; padding: 14px 16px;
          margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 3px solid transparent; }
  .task.done { background: #e9f5db; border-color: #90be6d; }
  .task .emoji { font-size: 38px; margin-right: 14px; }
  .task .info { flex: 1; }
  .task .name { font-size: 20px; font-weight: 600; }
  .task.done .name { text-decoration: line-through; opacity: .6; }
  .task .min { font-size: 14px; color: #888; margin-top: 2px; }
  .btn { border: none; border-radius: 16px; padding: 12px 16px; font-size: 18px; font-weight: 600;
         color: #fff; margin-left: 8px; }
  .btn-check { background: #f9844a; min-width: 72px; }
  .task.done .btn-check { background: #90be6d; }
  .btn-timer { background: #577590; }
  .timer-box { position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: rgba(0,0,0,.85);
               color: #fff; display: none; text-align: center; padding-top: 22vh; z-index: 99; }
  .timer-box .big { font-size: 90px; font-weight: 700; letter-spacing: 4px; }
  .timer-box .tname { font-size: 26px; margin-bottom: 12px; }
  .timer-box .btn { margin-top: 30px; font-size: 20px; padding: 14px 30px; }
  .celebrate { position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: rgba(255,240,200,.97);
               display: none; text-align: center; padding-top: 20vh; z-index: 98; }
  .celebrate .big { font-size: 110px; }
  .celebrate h2 { font-size: 32px; margin: 10px 0; }
  .week { display: flex; justify-content: space-around; margin: 16px 16px 0; background: #fff;
          border-radius: 20px; padding: 12px 6px; }
  .week .d { text-align: center; font-size: 14px; color: #666; }
  .week .d b { display: block; font-size: 16px; color: #333; }
  .week .d span { display: block; font-size: 18px; margin-top: 4px; }
  .week .d.today { color: #f9844a; font-weight: 700; }
  .muzzy { margin: 14px 16px 0; background: #fff; border-radius: 20px; padding: 14px 12px; }
  .muzzy .title { font-size: 18px; font-weight: 700; text-align: center; }
  .muzzy .hint { font-size: 14px; color: #666; text-align: center; margin: 4px 0 10px; }
  .muzzy .eps { display: flex; flex-wrap: wrap; justify-content: center; }
  .muzzy .ep { width: 15%; min-width: 60px; margin: 4px 1.5%; background: #fef6e4; border-radius: 14px;
               padding: 8px 2px; text-align: center; border: 3px solid transparent; }
  .muzzy .ep.next { border-color: #f9844a; }
  .muzzy .ep.full { background: #e9f5db; }
  .muzzy .ep b { display: block; font-size: 15px; }
  .muzzy .ep span { display: block; font-size: 13px; margin-top: 4px; min-height: 18px; }
  .foot { text-align: center; margin-top: 18px; }
  .foot button { background: transparent; border: none; color: #999; font-size: 13px; padding: 10px; }
  .settings { display: none; padding: 16px; }
  .settings h3 { margin: 12px 0 6px; }
  .settings textarea { width: 100%; height: 150px; font-size: 14px; border-radius: 10px;
                       border: 2px solid #ddd; padding: 8px; }
  .settings .tip { font-size: 13px; color: #777; }
  .settings .row { margin: 10px 0; }
  .settings select, .settings input { font-size: 16px; padding: 6px; }
</style>
</head>
<body>
<div id="app"></div>

<div class="timer-box" id="timerBox">
  <div class="tname" id="timerName"></div>
  <div class="big" id="timerText">10:00</div>
  <div id="timerHint" style="font-size:20px;opacity:.8;"></div>
  <button class="btn btn-check" id="timerStop">结束</button>
</div>

<div class="celebrate" id="celebrate">
  <div class="big">🎉</div>
  <h2>今天全部完成啦！</h2>
  <p style="font-size:20px;">你真棒！去玩吧～</p>
  <button class="btn btn-check" onclick="hideCelebrate()">好的</button>
</div>

<script>
(function () {
  var STORE_PLANS = 'daka_plans_v4';
  var STORE_DONE  = 'daka_done_v1';
  var STORE_PIN   = 'daka_pin_v1';
  var STORE_OVERRIDE = 'daka_override_v1';
  var STORE_MUZZY = 'daka_muzzy_v1';

  /* 默认任务：格式 emoji|名称|分钟(0表示不计时) */
  var DEFAULT_PLANS = {
    normal: [
      '🎵|早饭听英语儿歌|0',
      '🍪|到家休息 + 听英语 / Muzzy 音频|0',
      '📖|语文作业|10',
      '🔤|拼音声调练习|10',
      '👀|翻一翻明天的语文|3',
      '🚰|课间：喝水上厕所动一动|10',
      '🔢|数学作业 + 练习册|20',
      '🎮|自由玩耍|0',
      '🍚|晚饭|0',
      '💃|和妈妈一起跳舞|15',
      '🪢|和妈妈一起跳绳|20',
      '🎒|自己收书包|0',
      '🎧|洗漱听英语|10',
      '📚|睡前阅读|30',
      '😴|九点上床|0'
    ],
    english: [
      '🎵|早饭听英语儿歌|0',
      '🎧|地铁上戴耳机听儿歌|0',
      '🇬🇧|上英语课|0',
      '📖|语文数学读一读|15',
      '👀|翻一翻明天课本|3',
      '🎒|自己收书包|0',
      '😴|九点上床|0'
    ],
    weekend: [
      '🎵|早饭听英语儿歌|0',
      '🔤|拼音综合练习|15',
      '📝|补练习册|15',
      '📖|本周生字读一遍|5',
      '📺|看 Muzzy 一集|20',
      '💃|和妈妈一起跳舞|25',
      '🪢|和妈妈一起跳绳|20',
      '📚|阅读|30',
      '😴|九点上床|0'
    ]
  };
  var TYPE_NAME = { normal: '普通日', english: '英语课日', weekend: '周末' };
  var WEEK_CN = ['日','一','二','三','四','五','六'];
  var MUZZY_ROUNDS = 2;

  function load(key, def) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  function dateKey(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }
  function autoType(d) {
    var w = d.getDay();
    if (w === 0 || w === 6) return 'weekend';
    if (w === 2 || w === 5) return 'english';
    return 'normal';
  }
  function todayType() {
    var ov = load(STORE_OVERRIDE, {});
    var k = dateKey(new Date());
    return ov[k] || autoType(new Date());
  }
  function parsePlan(lines) {
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var p = lines[i].split('|');
      if (p.length < 2) continue;
      out.push({ e: p[0].trim(), n: p[1].trim(), m: parseInt(p[2] || '0', 10) || 0 });
    }
    return out;
  }

  var plans = load(STORE_PLANS, DEFAULT_PLANS);
  var doneMap = load(STORE_DONE, {});
  var muzzy = load(STORE_MUZZY, { total: 6, counts: [0,0,0,0,0,0] });
  var app = document.getElementById('app');

  function muzzyNext() {
    var min = 999, idx = -1;
    for (var i = 0; i < muzzy.total; i++) {
      var c = muzzy.counts[i] || 0;
      if (c < min) { min = c; idx = i; }
    }
    return { idx: idx, count: min };
  }

  function render() {
    var now = new Date();
    var key = dateKey(now);
    var type = todayType();
    var tasks = parsePlan(plans[type] || []);
    var done = doneMap[key] || [];
    var doneCount = 0;
    for (var i = 0; i < tasks.length; i++) if (done.indexOf(i) >= 0) doneCount++;
    var pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;

    var html = '';
    html += '<div class="header"><h1>⭐ 今日学习打卡</h1>';
    html += '<div class="date">' + (now.getMonth() + 1) + '月' + now.getDate() + '日 星期' + WEEK_CN[now.getDay()] + '</div>';
    html += '<div class="type">' + TYPE_NAME[type] + '</div></div>';
    html += '<div class="progress"><div style="width:' + pct + '%"></div></div>';
    html += '<div class="stars">已完成 ' + doneCount + ' / ' + tasks.length + '　';
    for (var s = 0; s < doneCount; s++) html += '⭐';
    html += '</div>';

    html += '<div class="list">';
    for (var j = 0; j < tasks.length; j++) {
      var t = tasks[j], isDone = done.indexOf(j) >= 0;
      html += '<div class="task' + (isDone ? ' done' : '') + '">';
      html += '<div class="emoji">' + t.e + '</div>';
      html += '<div class="info"><div class="name">' + t.n + '</div>';
      if (t.m > 0) html += '<div class="min">约 ' + t.m + ' 分钟</div>';
      html += '</div>';
      if (t.m > 0 && !isDone) html += '<button class="btn btn-timer" data-timer="' + j + '">⏱ 计时</button>';
      html += '<button class="btn btn-check" data-check="' + j + '">' + (isDone ? '✔ 完成' : '完成') + '</button>';
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="week">';
    var monday = new Date(now); var wd = now.getDay() === 0 ? 7 : now.getDay();
    monday.setDate(now.getDate() - (wd - 1));
    for (var d = 0; d < 7; d++) {
      var dd = new Date(monday); dd.setDate(monday.getDate() + d);
      var k2 = dateKey(dd); var cnt = (doneMap[k2] || []).length;
      html += '<div class="d' + (k2 === key ? ' today' : '') + '"><b>' + WEEK_CN[dd.getDay()] + '</b>' +
              '<span>' + (cnt > 0 ? '⭐' + cnt : '·') + '</span></div>';
    }
    html += '</div>';

    var nx = muzzyNext();
    html += '<div class="muzzy"><div class="title">📺 Muzzy 进度</div>';
    if (nx.count >= MUZZY_ROUNDS) {
      html += '<div class="hint">🎉 全部看完 ' + MUZZY_ROUNDS + ' 遍啦！可以进入下一级或换动画</div>';
    } else {
      html += '<div class="hint">本周该看：<b>第 ' + (nx.idx + 1) + ' 集</b>（第 ' + (nx.count + 1) + ' 遍）　看完点一下格子</div>';
    }
    html += '<div class="eps">';
    for (var e = 0; e < muzzy.total; e++) {
      var c = muzzy.counts[e] || 0;
      var cls = 'ep' + (e === nx.idx && nx.count < MUZZY_ROUNDS ? ' next' : '') + (c >= MUZZY_ROUNDS ? ' full' : '');
      var star = ''; for (var q = 0; q < c; q++) star += '⭐';
      html += '<div class="' + cls + '" data-ep="' + e + '"><b>第' + (e + 1) + '集</b><span>' + (star || '　') + '</span></div>';
    }
    html += '</div></div>';

    html += '<div class="foot"><button id="btnSettings">家长设置</button></div>';
    html += '<div class="settings" id="settings"></div>';

    app.innerHTML = html;

    var checks = app.querySelectorAll('[data-check]');
    for (var c2 = 0; c2 < checks.length; c2++) checks[c2].onclick = onCheck;
    var timers = app.querySelectorAll('[data-timer]');
    for (var tt = 0; tt < timers.length; tt++) timers[tt].onclick = onTimer;
    var eps = app.querySelectorAll('[data-ep]');
    for (var ee = 0; ee < eps.length; ee++) eps[ee].onclick = onEp;
    document.getElementById('btnSettings').onclick = openSettings;

    if (tasks.length && doneCount === tasks.length && !window.__celebrated) {
      window.__celebrated = true;
      document.getElementById('celebrate').style.display = 'block';
    }
  }

  function onCheck() {
    var idx = parseInt(this.getAttribute('data-check'), 10);
    var key = dateKey(new Date());
    var done = doneMap[key] || [];
    var pos = done.indexOf(idx);
    if (pos >= 0) done.splice(pos, 1); else done.push(idx);
    doneMap[key] = done;
    save(STORE_DONE, doneMap);
    render();
  }

  function onEp() {
    var e = parseInt(this.getAttribute('data-ep'), 10);
    var c = muzzy.counts[e] || 0;
    if (confirm('第 ' + (e + 1) + ' 集看完了吗？（点击"确定"记一遍）')) {
      muzzy.counts[e] = c + 1;
      save(STORE_MUZZY, muzzy);
      render();
    }
  }

  var timerId = null, remain = 0;
  function beep() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      var t = ctx.currentTime;
      for (var i = 0; i < 3; i++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.4;
        o.start(t + i * 0.5); o.stop(t + i * 0.5 + 0.3);
      }
    } catch (e) {}
  }
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }
  function onTimer() {
    var idx = parseInt(this.getAttribute('data-timer'), 10);
    var tasks = parsePlan(plans[todayType()] || []);
    var t = tasks[idx];
    remain = t.m * 60;
    document.getElementById('timerName').textContent = t.e + ' ' + t.n;
    document.getElementById('timerText').textContent = fmt(remain);
    document.getElementById('timerHint').textContent = '加油！';
    document.getElementById('timerBox').style.display = 'block';
    if (timerId) clearInterval(timerId);
    timerId = setInterval(function () {
      remain--;
      document.getElementById('timerText').textContent = fmt(Math.max(remain, 0));
      if (remain <= 0) {
        clearInterval(timerId); timerId = null;
        document.getElementById('timerHint').textContent = '⏰ 时间到！可以点"完成"啦';
        beep();
      }
    }, 1000);
  }
  document.getElementById('timerStop').onclick = function () {
    if (timerId) clearInterval(timerId);
    timerId = null;
    document.getElementById('timerBox').style.display = 'none';
  };
  window.hideCelebrate = function () {
    document.getElementById('celebrate').style.display = 'none';
  };

  function openSettings() {
    var pin = load(STORE_PIN, '1234');
    var input = prompt('请输入家长密码');
    if (input !== pin) { if (input !== null) alert('密码不对'); return; }
    var box = document.getElementById('settings');
    var key = dateKey(new Date());
    var ov = load(STORE_OVERRIDE, {});
    var cur = ov[key] || '';
    var h = '<p class="tip">每行一个任务，格式：表情|任务名|分钟（0 表示不计时）。改完点保存。</p>';
    h += '<div class="row">今天临时改为：<select id="ovSel">' +
         '<option value=""' + (cur === '' ? ' selected' : '') + '>按星期自动</option>' +
         '<option value="normal"' + (cur === 'normal' ? ' selected' : '') + '>普通日</option>' +
         '<option value="english"' + (cur === 'english' ? ' selected' : '') + '>英语课日</option>' +
         '<option value="weekend"' + (cur === 'weekend' ? ' selected' : '') + '>周末</option>' +
         '</select></div>';
    h += '<h3>普通日（一、三、四）</h3><textarea id="pNormal">' + (plans.normal || []).join('\n') + '</textarea>';
    h += '<h3>英语课日（二、五）</h3><textarea id="pEnglish">' + (plans.english || []).join('\n') + '</textarea>';
    h += '<h3>周末</h3><textarea id="pWeekend">' + (plans.weekend || []).join('\n') + '</textarea>';
    h += '<h3>Muzzy 设置</h3>';
    h += '<div class="row">总集数：<input id="muzzyTotal" type="tel" value="' + muzzy.total + '" style="width:70px;">　' +
         '<span class="tip">第一级 6 集；以后看第二级可改为 12</span></div>';
    h += '<div class="row"><button class="btn btn-timer" id="resetMuzzy">重置 Muzzy 进度</button></div>';
    h += '<div class="row">修改家长密码：<input id="newPin" type="tel" placeholder="留空不改" style="width:120px;"></div>';
    h += '<div class="row"><button class="btn btn-check" id="saveSet">保存</button> ' +
         '<button class="btn btn-timer" id="resetSet">恢复默认任务</button> ' +
         '<button class="btn" style="background:#999" id="closeSet">关闭</button></div>';
    h += '<p class="tip">如需清空今天的打卡记录，把今天所有任务点成"未完成"即可。</p>';
    box.innerHTML = h;
    box.style.display = 'block';
    window.scrollTo(0, document.body.scrollHeight);

    document.getElementById('saveSet').onclick = function () {
      function lines(id) {
        var arr = document.getElementById(id).value.split('\n'), out = [];
        for (var i = 0; i < arr.length; i++) if (arr[i].trim()) out.push(arr[i].trim());
        return out;
      }
      plans = { normal: lines('pNormal'), english: lines('pEnglish'), weekend: lines('pWeekend') };
      save(STORE_PLANS, plans);
      var sel = document.getElementById('ovSel').value;
      var ov2 = load(STORE_OVERRIDE, {});
      if (sel) ov2[key] = sel; else delete ov2[key];
      save(STORE_OVERRIDE, ov2);
      var nt = parseInt(document.getElementById('muzzyTotal').value, 10);
      if (nt > 0 && nt <= 30) {
        muzzy.total = nt;
        while (muzzy.counts.length < nt) muzzy.counts.push(0);
        save(STORE_MUZZY, muzzy);
      }
      var np = document.getElementById('newPin').value.trim();
      if (np) save(STORE_PIN, np);
      window.__celebrated = false;
      alert('已保存');
      render();
    };
    document.getElementById('resetMuzzy').onclick = function () {
      if (confirm('确定把 Muzzy 进度清零？')) {
        muzzy.counts = [];
        for (var i = 0; i < muzzy.total; i++) muzzy.counts.push(0);
        save(STORE_MUZZY, muzzy);
        render();
      }
    };
    document.getElementById('resetSet').onclick = function () {
      if (confirm('确定恢复默认任务？')) {
        plans = JSON.parse(JSON.stringify(DEFAULT_PLANS));
        save(STORE_PLANS, plans);
        render();
      }
    };
    document.getElementById('closeSet').onclick = function () { box.style.display = 'none'; };
  }

  render();
  window.__lastKey = dateKey(new Date());
  setInterval(function () {
    var k = dateKey(new Date());
    if (k !== window.__lastKey) { window.__lastKey = k; window.__celebrated = false; render(); }
  }, 60000);
})();
</script>
</body>
</html>
